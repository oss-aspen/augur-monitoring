apiVersion: 1

datasources:
  - name: Augur Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy # 'proxy' means the Grafana server handles requests
    editable: false
    isDefault: true
    # This is the magic key!
    # Give it a unique, stable string.
    uid: collectoss_prometheus_01
  - name: Augur Postgres
    uid: collectoss_postgres_01
    type: postgres
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASS}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: "disable" # disable/require/verify-ca/verify-full
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1600 # 903=9.3, 904=9.4, 905=9.5, 906=9.6, 1000=10
      timescaledb: false
