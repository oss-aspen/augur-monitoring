global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: postgres
    scrape_interval: 1m
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: flower
    static_configs:
      - targets: ["host.containers.internal:5555"]
    metric_relabel_configs:
    # Clean up worker names (extracts base name like 'facade')
      - source_labels: [worker]
        regex: '^([^:@]+).*'
        target_label: clean_worker
        replacement: '$1'
  - job_name: host
    static_configs:
      - targets: ["host.containers.internal:9100"]
  - job_name: "Prometheus SQL"
    scrape_interval: 1m
    static_configs:
      - targets: ["prometheus-sql:9560"]
